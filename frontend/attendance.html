<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance — EMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="dashboard.html" class="navbar-brand"><svg class="icon"><use href="#i-building"></use></svg> EMS</a>
    <div class="navbar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="employees.html" class="nav-link" id="emp-link" style="display:none">Employees</a>
        <a href="departments.html" class="nav-link" id="dept-link" style="display:none">Departments</a>
        <a href="attendance.html" class="nav-link active">Attendance</a>
        <a href="leaves.html" class="nav-link">Leaves</a>
        <a href="admin.html" class="nav-link" id="admin-link" style="display:none"><svg class="icon"><use href="#i-settings"></use></svg> Admin</a>
    </div>
    <div class="navbar-user">
        <span class="user-badge" id="user-email"></span>
        <span class="admin-badge" id="admin-badge" style="display:none">ADMIN</span>
        <a href="settings.html" class="nav-link">⚙️ settings</a>
        <button class="btn btn-secondary btn-sm" onclick="logout()">logout</button>
    </div>
</nav>

<div class="main-content">

    <!-- Mark attendance card -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><svg class="icon"><use href="#i-check-circle"></use></svg> mark attendance — today only</div>
            <span style="font-size:13px;color:#64748b" id="today-date"></span>
        </div>

        <div class="alert alert-error" id="mark-error">
            <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-alert-triangle"></use></svg></span>
            <div class="alert-content">
                <ul class="alert-list" id="mark-error-list"></ul>
            </div>
        </div>
        <div class="alert alert-success" id="mark-success">
            <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-check-circle"></use></svg></span>
            <div class="alert-content"><div id="mark-success-msg"></div></div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
            <div class="form-group">
                <label>employee code <span style="color:#ef4444">*</span></label>
                <input type="text" id="att-empcode" placeholder="enter employee code (e.g. EMP004)">
                <div class="field-error" id="att-empcode-error"></div>
            </div>
            <div class="form-group">
                <label>check-in time <span style="color:#ef4444">*</span></label>
                <input type="time" id="att-checkin">
                <div class="field-error" id="att-checkin-error"></div>
            </div>
            <div class="form-group">
                <label>status <span style="color:#ef4444">*</span></label>
                <select id="att-status">
                    <option value="present">present</option>
                    <option value="absent">absent</option>
                    <option value="half_day">half day</option>
                    <option value="work_from_home">work from home</option>
                    <option value="on_leave">on leave</option>
                </select>
            </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:auto;padding:10px 24px;font-size:15px" onclick="markAttendance()"><svg class="icon"><use href="#i-check-circle"></use></svg> mark attendance</button>
    </div>

    <!-- Update checkout -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><svg class="icon"><use href="#i-clock"></use></svg> update check-out</div>
        </div>
        <div class="alert alert-error" id="checkout-error" style="display:none">
            <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-alert-triangle"></use></svg></span>
            <div class="alert-content"><div id="checkout-error-msg"></div></div>
        </div>
        <div class="alert alert-success" id="checkout-success" style="display:none">
            <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-check-circle"></use></svg></span>
            <div class="alert-content"><div id="checkout-success-msg"></div></div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
            <div class="form-group" style="margin:0">
                <label>check-out time <span style="color:#ef4444">*</span></label>
                <input type="time" id="att-checkout">
            </div>
            <button class="btn btn-warning btn-lg" style="padding:10px 24px;font-size:15px" onclick="updateCheckout()"><svg class="icon"><use href="#i-clock"></use></svg> update check-out</button>
        </div>
    </div>

    <!-- View records -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><svg class="icon"><use href="#i-folder"></use></svg> attendance records</div>
        </div>
        <div class="search-bar">
            <input type="text" id="filter-empcode" placeholder="filter by employee code (e.g. EMP004)">
            <input type="date" id="filter-date">
            <button class="btn btn-secondary btn-sm" onclick="loadAttendance()">filter</button>
            <button class="btn btn-secondary btn-sm" onclick="clearFilter()">clear</button>
            <button class="btn btn-success btn-sm" style="margin-left:auto" onclick="exportAttendanceCSV()"><svg class="icon"><use href="#i-download"></use></svg> export csv</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>code</th>
                        <th>employee</th>
                        <th>date</th>
                        <th>day</th>
                        <th>check-in</th>
                        <th>check-out</th>
                        <th>hours worked</th>
                        <th>status</th>
                        <th id="th-actions">actions</th>
                    </tr>
                </thead>
                <tbody id="att-table">
                    <tr><td colspan="9" style="text-align:center;padding:40px;color:#64748b">loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
    requireLogin();
    document.getElementById('user-email').textContent = getCurrentEmail();
    
    const userEmpId = localStorage.getItem('emp_id');

    if (isAdmin()) {
    const userEmpCode = localStorage.getItem('employee_code');

    if (isAdmin()) {
        document.getElementById('admin-badge').style.display = 'inline';
        document.getElementById('admin-link').style.display = 'inline';
        if (document.getElementById('emp-link')) document.getElementById('emp-link').style.display = 'inline';
        if (document.getElementById('dept-link')) document.getElementById('dept-link').style.display = 'inline';
    } else {
        if (userEmpCode && userEmpCode !== 'null') {
            document.getElementById('att-empcode').value = userEmpCode;
            document.getElementById('att-empcode').readOnly = true;
            document.getElementById('att-empcode').style.background = '#f8fafc';
            document.getElementById('filter-empcode').value = userEmpCode;
            document.getElementById('filter-empcode').readOnly = true;
            document.getElementById('filter-empcode').style.background = '#f8fafc';
        }
    }

    document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

    // Set current time as default check-in
    const now = new Date();
    document.getElementById('att-checkin').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    async function markAttendance() {
        const empCode = document.getElementById('att-empcode').value || userEmpCode;
        const checkIn = document.getElementById('att-checkin').value;
        const status = document.getElementById('att-status').value;
        const errors = [];

        document.getElementById('att-empcode').classList.remove('error');
        document.getElementById('att-empcode-error').classList.remove('show');
        document.getElementById('att-checkin').classList.remove('error');
        document.getElementById('att-checkin-error').classList.remove('show');
        document.getElementById('mark-error').classList.remove('show');
        document.getElementById('mark-success').classList.remove('show');

        if (!empCode) {
            document.getElementById('att-empcode').classList.add('error');
            document.getElementById('att-empcode-error').textContent = 'employee code is required';
            document.getElementById('att-empcode-error').classList.add('show');
            errors.push('employee code is required');
        }
        if (!checkIn) {
            document.getElementById('att-checkin').classList.add('error');
            document.getElementById('att-checkin-error').textContent = 'check-in time is required';
            document.getElementById('att-checkin-error').classList.add('show');
            errors.push('check-in time is required');
        }

        if (errors.length > 0) {
            document.getElementById('mark-error-list').innerHTML = errors.map(e => `<li>${e}</li>`).join('');
            document.getElementById('mark-error').classList.add('show');
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        try {
            const res = await fetch('http://localhost:8000/attendance/', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify({
                    employee_code: empCode,
                    date: today,
                    check_in: checkIn + ':00',
                    status
                })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('mark-success-msg').textContent = 'attendance marked successfully!';
                document.getElementById('mark-success').classList.add('show');
                loadAttendance();
            } else {
                document.getElementById('mark-error-list').innerHTML = `<li>${data.detail}</li>`;
                document.getElementById('mark-error').classList.add('show');
            }
        } catch(e) {
            document.getElementById('mark-error-list').innerHTML = '<li>connection failed</li>';
            document.getElementById('mark-error').classList.add('show');
        }
    }

    async function updateCheckout() {
        let id = null;
        const time = document.getElementById('att-checkout').value;

        document.getElementById('checkout-error').style.display = 'none';
        document.getElementById('checkout-success').style.display = 'none';

        if (!time) {
            document.getElementById('checkout-error-msg').textContent = 'check-out time is required';
            document.getElementById('checkout-error').style.display = 'flex';
            return;
        }

        // Auto-find today's record for logged-in user or empCode
        const today = new Date().toISOString().split('T')[0];
        const empId = userEmpId;
        if (empId) {
            try {
                const findRes = await fetch(`http://localhost:8000/attendance/?employee_id=${empId}&date_filter=${today}`, { headers: authHeaders() });
                if (findRes.ok) {
                    const recs = await findRes.json();
                    if (recs && recs.length) {
                        id = recs[0].id;
                    }
                }
            } catch(e) {}
        }

        if (!id) {
            document.getElementById('checkout-error-msg').textContent = 'no active attendance record found for today';
            document.getElementById('checkout-error').style.display = 'flex';
            return;
        }

        const res = await fetch(`http://localhost:8000/attendance/${id}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({check_out: time + ':00'})
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('checkout-success-msg').textContent = 'check-out updated successfully!';
            document.getElementById('checkout-success').style.display = 'flex';
            loadAttendance();
        } else {
            document.getElementById('checkout-error-msg').textContent = data.detail || 'update failed';
            document.getElementById('checkout-error').style.display = 'flex';
        }
    }

    async function loadAttendance() {
        let empCodeFilter = document.getElementById('filter-empcode').value.trim();
        if (!isAdmin() && userEmpCode && userEmpCode !== 'null') {
            empCodeFilter = userEmpCode;
        }

        const date = document.getElementById('filter-date').value;
        let url = 'http://localhost:8000/attendance/?';
        if (date) url += `date_filter=${date}`;

        const res = await fetch(url, {headers: authHeaders()});
        let data = await res.json();

        if (empCodeFilter && data && data.length) {
            data = data.filter(a => {
                const c = a.employee_code || '';
                return c.toLowerCase().includes(empCodeFilter.toLowerCase());
            });
        }

        const statusColors = {
            present: 'badge-green',
            absent: 'badge-red',
            half_day: 'badge-yellow',
            work_from_home: 'badge-blue',
            on_leave: 'badge-gray'
        };

        if (!data || !data.length) {
            document.getElementById('att-table').innerHTML =
                `<tr><td colspan="8"><div class="empty-state"><svg class="icon"><use href="#i-folder"></use></svg><p>no records found</p></div></td></tr>`;
            return;
        }

        document.getElementById('att-table').innerHTML = data.map(a => {
            const isWeekend = a.day_name === 'Saturday' || a.day_name === 'Sunday';
            const rowStyle = isWeekend ? 'style="background:#fef2f2;border-left:3px solid #ef4444"' : '';
            const empCode = a.employee_code || ('EMP' + String(a.employee_id).padStart(3, '0'));
            const empName = a.employee_name ? `<span style="font-size:12px;color:#64748b">(${a.employee_name})</span>` : '';
            const hrsDisplay = a.hours_worked ? `${a.hours_worked.toFixed(1)} hrs` : '0.0 hrs';

            return `
            <tr ${rowStyle}>
                <td><strong style="color:#1e40af">${empCode}</strong></td>
                <td>${empName || ('emp #' + a.employee_id)}</td>
                <td>${a.date}</td>
                <td><span style="font-size:12px;font-weight:600;color:${isWeekend?'#dc2626':'#64748b'}">${a.day_name || ''}</span></td>
                <td>${a.check_in || '—'}</td>
                <td>${a.check_out || '<span style="color:#f59e0b">pending</span>'}</td>
                <td><span class="badge ${a.hours_worked && a.hours_worked < 8 ? 'badge-yellow' : 'badge-gray'}">${hrsDisplay}</span></td>
                <td><span class="badge ${statusColors[a.status] || 'badge-gray'}">${a.status.replace('_',' ')}</span></td>
                ${isAdmin() ? `<td><button class="btn btn-danger btn-sm" onclick="deleteAtt(${a.id})">delete</button></td>` : ''}
            </tr>`;
        }).join('');
    }

    function clearFilter() {
        if (isAdmin()) {
            document.getElementById('filter-emp').value = '';
        }
        document.getElementById('filter-date').value = '';
        loadAttendance();
    }

    async function deleteAtt(id) {
        if (!confirm('delete this attendance record?')) return;
        const res = await fetch(`http://localhost:8000/attendance/${id}`, {
            method: 'DELETE', headers: authHeaders()
        });
        if (res.ok) loadAttendance();
    }

    function exportAttendanceCSV() {
        const emp = document.getElementById('filter-emp').value;
        const dt = document.getElementById('filter-date').value;
        let url = 'http://localhost:8000/attendance/export?';
        if (emp) url += `employee_id=${emp}&`;
        if (dt) {
            url += `start_date=${dt}&end_date=${dt}&`;
        }
        window.open(url, '_blank');
    }

    loadAttendance();
</script>
</body>
</html>
