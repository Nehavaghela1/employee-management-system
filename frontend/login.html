<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon"><svg class="icon"><use href="#i-building"></use></svg></div>
        <h1>Welcome back</h1>
        <p>Sign in to Employee Management System</p>
    </div>

    <!-- Error box — shows multiple errors together -->
    <div class="alert alert-error" id="error-box">
        <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-alert-triangle"></use></svg></span>
        <div class="alert-content">
            <div class="alert-title">Please fix the following:</div>
            <ul class="alert-list" id="error-list"></ul>
        </div>
    </div>

    <div class="form-group">
        <label>Email address or Employee Code</label>
        <input type="text" id="email" autocomplete="username" placeholder="you@example.com or EMP001" name="username">
        <div class="field-error" id="email-error">please enter a valid email address or employee code</div>
    </div>

    <div class="form-group">
        <label>Password</label>
        <div style="position:relative">
            <input type="password" id="password" autocomplete="current-password" placeholder="minimum 8 characters" name="password" style="padding-right:40px">
            <button type="button" onclick="togglePasswordVisibility()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;padding:4px" title="Show/Hide password">👁️</button>
        </div>
        <div class="field-error" id="password-error">password must be at least 8 characters</div>
    </div>

    <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">
        Sign in
    </button>

    <div style="text-align:center;margin-top:12px">
        <a href="forgot-password.html" style="font-size:13px;color:#64748b">forgot password?</a>
    </div>

    <div class="auth-link">
        don't have an account? <a href="register.html">register here</a>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
    // Password visibility toggle
    function togglePasswordVisibility() {
        const passInput = document.getElementById('password');
        if (passInput.type === 'password') {
            passInput.type = 'text';
        } else {
            passInput.type = 'password';
        }
    }

    // If already logged in — go to dashboard
    if (isLoggedIn()) window.location.href = 'dashboard.html';
    


    // Client-side validation
    function validate() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errors = [];

        // Reset field errors
        document.getElementById('email').classList.remove('error');
        document.getElementById('password').classList.remove('error');
        document.getElementById('email-error').classList.remove('show');
        document.getElementById('password-error').classList.remove('show');

        // Email / Employee Code / Username check
        if (!email) {
            errors.push('email or employee code is required');
            document.getElementById('email').classList.add('error');
            document.getElementById('email-error').textContent = 'email or employee code is required';
            document.getElementById('email-error').classList.add('show');
        }

        // Password check
        if (!password) {
            errors.push('password is required');
            document.getElementById('password').classList.add('error');
            document.getElementById('password-error').textContent = 'password is required';
            document.getElementById('password-error').classList.add('show');
        } else if (password.length < 8) {
            errors.push('password must be at least 8 characters');
            document.getElementById('password').classList.add('error');
            document.getElementById('password-error').textContent = 'password must be at least 8 characters';
            document.getElementById('password-error').classList.add('show');
        }

        return errors;
    }

    function showErrors(errors) {
        const box = document.getElementById('error-box');
        const list = document.getElementById('error-list');
        if (!errors || errors.length === 0) {
            box.classList.remove('show');
            return;
        }
        const formatted = errors.map(e => {
            if (typeof e === 'string') return e;
            if (e && e.msg) return e.msg;
            return JSON.stringify(e);
        });
        list.innerHTML = formatted.map(e => `<li>${e}</li>`).join('');
        box.classList.add('show');
    }

    async function handleLogin() {
        const errors = validate();
        if (errors.length > 0) {
            showErrors(errors);
            return;
        }

        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> signing in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('http://localhost:8000/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();

        if (res.ok) {
            const payload = JSON.parse(atob(data.access_token.split('.')[1]));
            localStorage.setItem('token', data.access_token);
            localStorage.setItem('email', payload.sub);


            const meRes = await fetch('http://localhost:8000/auth/me', {
                headers: {'Authorization': `Bearer ${data.access_token}`}
            });
            const meData = await meRes.json();
            localStorage.setItem('is_admin', meData.is_admin);
            localStorage.setItem('emp_id', meData.employee_id || '');
            localStorage.setItem('employee_code', meData.employee_code || '');

            window.location.href = 'dashboard.html';
        } else {
                const errDetail = Array.isArray(data.detail)
                    ? data.detail.map(d => d.msg || 'invalid input')
                    : [data.detail || 'invalid email, employee code, or password'];
                showErrors(errDetail);
            }
        } catch(e) {
            showErrors(['connection failed. make sure server is running.']);
        }

        btn.disabled = false;
        btn.innerHTML = 'Sign in';
    }

    // Allow Enter key
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
    });

    // Live validation — clear error when user types
    document.getElementById('email').addEventListener('input', () => {
        document.getElementById('email').classList.remove('error');
        document.getElementById('email-error').classList.remove('show');
        document.getElementById('error-box').classList.remove('show');
    });

    document.getElementById('password').addEventListener('input', () => {
        document.getElementById('password').classList.remove('error');
        document.getElementById('password-error').classList.remove('show');
        document.getElementById('error-box').classList.remove('show');
    });
</script>
</body>
</html>
