<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — EMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="dashboard.html" class="navbar-brand"><svg class="icon"><use href="#i-building"></use></svg> EMS</a>
    <div class="navbar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="employees.html" class="nav-link">Employees</a>
        <a href="departments.html" class="nav-link">Departments</a>
        <a href="attendance.html" class="nav-link">Attendance</a>
        <a href="leaves.html" class="nav-link">Leaves</a>
        <a href="admin.html" class="nav-link active"><svg class="icon"><use href="#i-settings"></use></svg> Admin</a>
    </div>
    <div class="navbar-user">
        <span class="user-badge" id="user-email"></span>
        <span class="admin-badge">ADMIN</span>
        <a href="settings.html" class="nav-link">⚙️ settings</a>
        <button class="btn btn-secondary btn-sm" onclick="logout()">logout</button>
    </div>
</nav>

<div class="main-content">

    <!-- Make admin -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><svg class="icon"><use href="#i-shield"></use></svg> promote user to admin</div>
        </div>
        <div class="alert alert-error" id="admin-error" style="display:none">
            <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-alert-triangle"></use></svg></span>
            <div class="alert-content"><div id="admin-error-msg"></div></div>
        </div>
        <div class="alert alert-success" id="admin-success" style="display:none">
            <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-check-circle"></use></svg></span>
            <div class="alert-content"><div id="admin-success-msg"></div></div>
        </div>
        <div style="display:flex;gap:12px;align-items:flex-end">
            <div class="form-group" style="margin:0;flex:1">
                <label>user id or employee code to promote <span style="color:#ef4444">*</span></label>
                <input type="text" id="promote-id" placeholder="enter employee code (e.g. EMP001), email or user id">
            </div>
            <button class="btn btn-warning" onclick="makeAdmin()">promote to admin</button>
        </div>
    </div>

    <!-- Pending leaves for admin -->
    <div class="card">
        <div class="card-header">
            <div class="card-title"><svg class="icon"><use href="#i-calendar"></use></svg> pending leave requests</div>
            <span class="badge badge-yellow" id="pending-count">loading...</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>employee</th>
                        <th>type</th>
                        <th>from</th>
                        <th>to</th>
                        <th>days</th>
                        <th>reason</th>
                        <th>actions</th>
                    </tr>
                </thead>
                <tbody id="pending-table">
                    <tr><td colspan="7" style="text-align:center;padding:40px;color:#64748b">loading...</td></tr>
                </tbody>
            </table>
        </div>
    <!-- System Activity Audit Logs -->
    <div class="card" style="margin-top:20px">
        <div class="card-header">
            <div class="card-title"><svg class="icon"><use href="#i-clock"></use></svg> real-time activity audit logs</div>
            <button class="btn btn-secondary btn-sm" onclick="loadAuditLogs()">refresh logs</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>timestamp</th>
                        <th>user email</th>
                        <th>emp code</th>
                        <th>action</th>
                        <th>details</th>
                    </tr>
                </thead>
                <tbody id="audit-logs-table">
                    <tr><td colspan="5" style="text-align:center;padding:30px;color:#64748b">loading activity logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
    requireAdmin();
    document.getElementById('user-email').textContent = getCurrentEmail();

    async function makeAdmin() {
        const id = document.getElementById('promote-id').value.trim();
        document.getElementById('admin-error').style.display = 'none';
        document.getElementById('admin-success').style.display = 'none';

        if (!id) {
            document.getElementById('admin-error-msg').textContent = 'please enter an employee code, email or user id';
            document.getElementById('admin-error').style.display = 'flex';
            return;
        }

        const res = await fetch(`http://localhost:8000/auth/make-admin/${encodeURIComponent(id)}`, {
            method: 'POST', headers: authHeaders()
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('admin-success-msg').textContent = data.message || 'user promoted to admin';
            document.getElementById('admin-success').style.display = 'flex';
            document.getElementById('promote-id').value = '';
        } else {
            document.getElementById('admin-error-msg').textContent = data.detail || 'promotion failed';
            document.getElementById('admin-error').style.display = 'flex';
        }
    }

    async function loadPendingLeaves() {
        const res = await fetch('http://localhost:8000/leaves/?status=pending&limit=50', {
            headers: authHeaders()
        });
        const data = await res.json();
        document.getElementById('pending-count').textContent = `${data.length} pending`;

        if (!data.length) {
            document.getElementById('pending-table').innerHTML =
                `<tr><td colspan="7"><div class="empty-state"><svg class="icon"><use href="#i-check-circle"></use></svg><p>no pending leaves</p></div></td></tr>`;
            return;
        }

        document.getElementById('pending-table').innerHTML = data.map(l => {
            const empDisplay = l.employee_code
                ? `<strong>${l.employee_code}</strong> ${l.employee_name ? `<span style="color:#64748b;font-size:12px">(${l.employee_name})</span>` : ''}`
                : `emp #${l.employee_id}`;
            const numDays = Math.ceil((new Date(l.end_date) - new Date(l.start_date)) / (1000*60*60*24)) + 1;
            return `
            <tr>
                <td>${empDisplay}</td>
                <td><span class="badge badge-blue">${l.leave_type}</span></td>
                <td>${formatDDMMYYYY(l.start_date)}</td>
                <td>${formatDDMMYYYY(l.end_date)}</td>
                <td><span class="badge badge-gray">${numDays}d</span></td>
                <td style="color:#64748b">${l.reason || '—'}</td>
                <td>
                    <button class="btn btn-success btn-sm" onclick="updateLeave(${l.id},'approved')">approve</button>
                    <button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="updateLeave(${l.id},'rejected')">reject</button>
                </td>
            </tr>
            `;
        }).join('');
    }

    async function updateLeave(id, status) {
        const res = await fetch(`http://localhost:8000/leaves/${id}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({status})
        });
        if (res.ok) loadPendingLeaves();
    }

    async function loadAuditLogs() {
        try {
            const res = await fetch('http://localhost:8000/audit-logs/?limit=50', {
                headers: authHeaders()
            });
            if (!res.ok) return;
            const logs = await res.json();
            if (!logs || !logs.length) {
                document.getElementById('audit-logs-table').innerHTML =
                    `<tr><td colspan="5" style="text-align:center;padding:20px;color:#64748b">no activity logs found</td></tr>`;
                return;
            }
            document.getElementById('audit-logs-table').innerHTML = logs.map(log => {
                const ts = new Date(log.timestamp).toLocaleString();
                const actionBadgeClass = log.action.includes('SUCCESS') || log.action.includes('REACTIVATE') ? 'badge-green' :
                                         log.action.includes('BLOCKED') || log.action.includes('DEACTIVATE') || log.action.includes('FAILED') ? 'badge-red' : 'badge-blue';
                return `
                <tr>
                    <td style="font-size:12px;color:#64748b">${ts}</td>
                    <td><strong>${log.user_email || '—'}</strong></td>
                    <td><strong style="color:#1e40af">${log.employee_code || '—'}</strong></td>
                    <td><span class="badge ${actionBadgeClass}">${log.action}</span></td>
                    <td style="font-size:12px;color:#475569">${log.details || '—'}</td>
                </tr>`;
            }).join('');
        } catch(e) {}
    }

    loadPendingLeaves();
    loadAuditLogs();
</script>
</body>
</html>
