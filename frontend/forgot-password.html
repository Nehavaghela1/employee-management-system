<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — EMS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .code-box {
            background: #eff6ff;
            border: 1.5px dashed #3b82f6;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .code-box .code-val {
            font-family: monospace;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #1d4ed8;
            margin: 6px 0;
        }
        .code-box p {
            font-size: 12px;
            color: #64748b;
        }
        .password-rules {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
            list-style: none;
        }
        .password-rules li {
            padding: 2px 0;
            transition: color 0.2s;
        }
        .password-rules li::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            border: 1.5px solid #cbd5e1;
            margin-right: 7px;
        }
        .password-rules li.pass { color: #1e293b; }
        .password-rules li.pass::before { background: #16a34a; border-color: #16a34a; }
    </style>
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon"><svg class="icon"><use href="#i-building"></use></svg></div>
        <h1>Reset Password</h1>
        <p id="sub-title">request a password reset code</p>
    </div>

    <!-- Error box -->
    <div class="alert alert-error" id="error-box">
        <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-alert-triangle"></use></svg></span>
        <div class="alert-content">
            <div class="alert-title">please fix the following:</div>
            <ul class="alert-list" id="error-list"></ul>
        </div>
    </div>

    <!-- Success box -->
    <div class="alert alert-success" id="success-box">
        <span class="alert-icon"><svg class="icon icon-lg"><use href="#i-check-circle"></use></svg></span>
        <div class="alert-content">
            <div class="alert-title">password reset successfully!</div>
            <div>redirecting to login in 2 seconds...</div>
        </div>
    </div>

    <!-- STEP 1: Request Reset Code -->
    <div id="step-1">
        <div class="form-group">
            <label>email address <span style="color:#ef4444">*</span></label>
            <input type="email" id="s1-email" placeholder="you@example.com" autocomplete="email">
            <div class="field-error" id="s1-email-error"></div>
        </div>

        <button class="btn btn-primary" id="btn-request" onclick="handleRequestCode()">
            send reset code
        </button>

        <div class="auth-link">
            remembered your password? <a href="login.html">sign in</a>
        </div>
    </div>

    <!-- STEP 2: Reset Password (Hidden by default) -->
    <div id="step-2" style="display:none">
        <!-- Highlighted reset code box -->
        <div class="code-box">
            <span style="font-size:12px;font-weight:600;color:#1e40af">YOUR RESET CODE</span>
            <div class="code-val" id="displayed-code">------</div>
        </div>

        <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <label style="margin-bottom:0">reset code <span style="color:#ef4444">*</span></label>
                <button type="button" class="btn btn-warning btn-sm" id="btn-resend" onclick="handleResendCode()" style="font-size:12px;padding:4px 10px">🔄 resend OTP</button>
            </div>
            <input type="text" id="s2-code" placeholder="enter 6-digit code" maxlength="10">
            <div class="field-error" id="s2-code-error"></div>
            <div id="resend-success-msg" style="font-size:12px;color:#16a34a;margin-top:6px;display:none;font-weight:500">✓ new reset code generated & updated!</div>
        </div>

        <div class="form-group">
            <label>new password <span style="color:#ef4444">*</span></label>
            <div style="position:relative">
                <input type="password" id="s2-password" placeholder="minimum 8 characters" maxlength="50" autocomplete="new-password">
                <button type="button" id="toggle-password" onclick="togglePassword('s2-password','toggle-password')" aria-label="Show password"
                    style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;display:flex"><svg class="icon"><use href="#i-eye"></use></svg></button>
            </div>
            <div class="field-error" id="s2-password-error"></div>

            <!-- Strength bar -->
            <div id="strength-bar" style="margin-top:8px;height:4px;border-radius:4px;background:#e2e8f0;display:none">
                <div id="strength-fill" style="height:100%;border-radius:4px;transition:all 0.3s;width:0%"></div>
            </div>
            <div id="strength-text" style="font-size:11px;margin-top:4px;display:none"></div>
        </div>

        <div class="form-group">
            <label>confirm password <span style="color:#ef4444">*</span></label>
            <div style="position:relative">
                <input type="password" id="s2-confirm" placeholder="re-enter new password" maxlength="50" autocomplete="new-password">
                <button type="button" id="toggle-confirm" onclick="togglePassword('s2-confirm','toggle-confirm')" aria-label="Show password"
                    style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;display:flex"><svg class="icon"><use href="#i-eye"></use></svg></button>
            </div>
            <div class="field-error" id="s2-confirm-error"></div>
            <div id="match-indicator" style="font-size:11px;margin-top:4px;display:none"></div>
        </div>

        <button class="btn btn-primary" id="btn-reset" onclick="handleResetPassword()">
            reset password
        </button>

        <div class="auth-link">
            back to <a href="login.html">sign in</a>
        </div>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    let resetEmail = '';

    function showErrors(errors) {
        const box = document.getElementById('error-box');
        const list = document.getElementById('error-list');
        if (!errors || errors.length === 0) {
            box.classList.remove('show');
            return;
        }
        list.innerHTML = errors.map(e => `<li>${e}</li>`).join('');
        box.classList.add('show');
        box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }

    function clearFieldError(id) {
        document.getElementById(id).classList.remove('error');
        const err = document.getElementById(`${id}-error`);
        if (err) { err.textContent = ''; err.classList.remove('show'); }
        document.getElementById('error-box').classList.remove('show');
    }

    function setFieldError(id, msg) {
        document.getElementById(id).classList.add('error');
        const err = document.getElementById(`${id}-error`);
        if (err) { err.textContent = msg; err.classList.add('show'); }
    }

    // Toggle password visibility
    function togglePassword(inputId, btnId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        const use = btn.querySelector('use');
        if (input.type === 'password') {
            input.type = 'text';
            use.setAttribute('href', '#i-eye-off');
            btn.setAttribute('aria-label', 'Hide password');
        } else {
            input.type = 'password';
            use.setAttribute('href', '#i-eye');
            btn.setAttribute('aria-label', 'Show password');
        }
    }

    // --- STEP 1 BLUR VALIDATION ---
    document.getElementById('s1-email').addEventListener('blur', function() {
        const val = this.value.trim();
        clearFieldError('s1-email');
        if (!val) {
            setFieldError('s1-email', 'email address is required');
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
            setFieldError('s1-email', 'enter a valid email address');
        }
    });

    document.getElementById('s1-email').addEventListener('input', () => clearFieldError('s1-email'));

    // --- STEP 1 SUBMIT ---
    async function handleRequestCode() {
        const email = document.getElementById('s1-email').value.trim();
        const errors = [];

        clearFieldError('s1-email');

        // Sequential validation: blank first, then format
        if (!email) {
            setFieldError('s1-email', 'email address is required');
            errors.push('email address is required');
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setFieldError('s1-email', 'enter a valid email address');
            errors.push('enter a valid email address');
        }

        if (errors.length > 0) {
            showErrors(errors);
            return;
        }

        const btn = document.getElementById('btn-request');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> sending reset code...';
        showErrors([]);

        try {
            const res = await fetch('http://localhost:8000/auth/forgot-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email})
            });
            const data = await res.json();

            if (res.ok) {
                resetEmail = data.email || email;
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
                document.getElementById('sub-title').textContent = 'enter your new password';
                
                const code = data.reset_code || '123456';
                document.getElementById('displayed-code').textContent = code;
                document.getElementById('s2-code').value = code;
            } else {
                showErrors([data.detail || 'failed to generate reset code']);
            }
        } catch(e) {
            showErrors(['connection failed. make sure server is running.']);
        }

        btn.disabled = false;
        btn.innerHTML = 'send reset code';
    }

    async function handleResendCode() {
        if (!resetEmail) return;
        const btn = document.getElementById('btn-resend');
        const successEl = document.getElementById('resend-success-msg');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> resending...';
        showErrors([]);
        if (successEl) successEl.style.display = 'none';

        try {
            const res = await fetch('http://localhost:8000/auth/forgot-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: resetEmail})
            });
            const data = await res.json();

            if (res.ok) {
                const code = data.reset_code;
                document.getElementById('displayed-code').textContent = code;
                document.getElementById('s2-code').value = code;
                clearFieldError('s2-code');
                if (successEl) {
                    successEl.style.display = 'block';
                    setTimeout(() => { successEl.style.display = 'none'; }, 4000);
                }
            } else {
                showErrors([data.detail || 'failed to resend code']);
            }
        } catch(e) {
            showErrors(['connection failed. make sure server is running.']);
        }

        btn.disabled = false;
        btn.innerHTML = '🔄 resend OTP';
    }

    // --- STEP 2 LIVE VALIDATION ---
    document.getElementById('s2-password').addEventListener('input', function() {
        const val = this.value;
        const bar = document.getElementById('strength-bar');
        const fill = document.getElementById('strength-fill');
        const text = document.getElementById('strength-text');

        if (!val) {
            bar.style.display = 'none';
            text.style.display = 'none';
            return;
        }

        bar.style.display = 'block';
        text.style.display = 'block';

        const hasLength = val.length >= 8;
        const hasUpper = /[A-Z]/.test(val);
        const hasNumber = /[0-9]/.test(val);
        const hasSpecial = /[^A-Za-z0-9]/.test(val);

        let score = [hasLength, hasUpper, hasNumber, hasSpecial].filter(Boolean).length;
        const levels = [
            { color: '#ef4444', label: 'weak', width: '25%' },
            { color: '#f59e0b', label: 'fair', width: '50%' },
            { color: '#3b82f6', label: 'good', width: '75%' },
            { color: '#22c55e', label: 'strong', width: '100%' }
        ];
        const level = levels[score - 1] || levels[0];
        fill.style.background = level.color;
        fill.style.width = level.width;
        text.style.color = level.color;
        text.textContent = `password strength: ${level.label}`;

        clearFieldError('s2-password');
        checkMatch();
    });

    document.getElementById('s2-confirm').addEventListener('input', function() {
        clearFieldError('s2-confirm');
        checkMatch();
    });

    function checkMatch() {
        const pass = document.getElementById('s2-password').value;
        const conf = document.getElementById('s2-confirm').value;
        const ind = document.getElementById('match-indicator');

        if (!conf) { ind.style.display = 'none'; return; }
        ind.style.display = 'block';
        if (pass === conf) {
            ind.style.color = '#16a34a';
            ind.textContent = 'passwords match';
        } else {
            ind.style.color = '#ef4444';
            ind.textContent = 'passwords do not match';
        }
    }

    // --- STEP 2 BLUR VALIDATION ---
    document.getElementById('s2-code').addEventListener('blur', function() {
        const val = this.value.trim();
        clearFieldError('s2-code');
        if (!val) setFieldError('s2-code', 'reset code is required');
    });

    document.getElementById('s2-password').addEventListener('blur', function() {
        const val = this.value;
        clearFieldError('s2-password');
        if (!val) {
            setFieldError('s2-password', 'new password is required');
        } else if (val.length < 8) {
            setFieldError('s2-password', 'password must be at least 8 characters');
        }
    });

    document.getElementById('s2-confirm').addEventListener('blur', function() {
        const val = this.value;
        const pass = document.getElementById('s2-password').value;
        clearFieldError('s2-confirm');
        if (!val) {
            setFieldError('s2-confirm', 'confirm password is required');
        } else if (val !== pass) {
            setFieldError('s2-confirm', 'passwords do not match');
        }
    });

    // --- STEP 2 SUBMIT ---
    async function handleResetPassword() {
        const code = document.getElementById('s2-code').value.trim();
        const password = document.getElementById('s2-password').value;
        const confirm = document.getElementById('s2-confirm').value;
        const errors = [];

        clearFieldError('s2-code');
        clearFieldError('s2-password');
        clearFieldError('s2-confirm');

        // Sequential validation for Step 2
        if (!code) {
            setFieldError('s2-code', 'reset code is required');
            errors.push('reset code is required');
        }

        if (!password) {
            setFieldError('s2-password', 'new password is required');
            errors.push('new password is required');
        } else if (password.length < 8) {
            setFieldError('s2-password', 'password must be at least 8 characters');
            errors.push('password must be at least 8 characters');
        }

        if (!confirm) {
            setFieldError('s2-confirm', 'confirm password is required');
            errors.push('confirm password is required');
        } else if (password !== confirm) {
            setFieldError('s2-confirm', 'passwords do not match');
            errors.push('passwords do not match');
        }

        if (errors.length > 0) {
            showErrors(errors);
            return;
        }

        const btn = document.getElementById('btn-reset');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> resetting password...';
        showErrors([]);

        try {
            const res = await fetch('http://localhost:8000/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: resetEmail,
                    reset_code: code,
                    new_password: password
                })
            });
            const data = await res.json();

            if (res.ok) {
                document.getElementById('step-2').style.display = 'none';
                document.getElementById('success-box').classList.add('show');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                showErrors([data.detail || 'password reset failed']);
            }
        } catch(e) {
            showErrors(['connection failed. make sure server is running.']);
        }

        btn.disabled = false;
        btn.innerHTML = 'reset password';
    }

    // Keyboard navigation
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            if (document.getElementById('step-1').style.display !== 'none') {
                handleRequestCode();
            } else {
                handleResetPassword();
            }
        }
    });
</script>
</body>
</html>
